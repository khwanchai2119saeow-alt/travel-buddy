# เผยแพร่แอปขึ้น GitHub Pages อัตโนมัติทุกครั้งที่ push เข้า main (ฟรี ไม่ต้องผูกบัตร)
# ครั้งแรก: Settings → Pages → Source = "GitHub Actions"
# ลิงก์แอปจะเป็น https://<ชื่อผู้ใช้>.github.io/<ชื่อ repo>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci รัน postinstall ที่คัดลอกไฟล์ OCR (ญี่ปุ่น/อังกฤษ/จีน) ไป public/ocr ให้ใช้ออฟไลน์ได้
      - run: npm ci
      - run: npm run build
        env:
          # แอปอยู่ใต้ /<ชื่อ repo>/ บน GitHub Pages
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
